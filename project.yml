name: MiniPhone

options:
  bundleIdPrefix: com.melly
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  minimumXcodeGenVersion: "2.38.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual

targets:
  MiniPhone:
    type: application
    platform: iOS
    sources:
      - path: MiniPhone
      # 随包发布的歌单。folder reference 保留目录结构，
      # App 里用 Bundle.main.url(forResource: "Music", withExtension: nil) 遍历。
      - path: Assets/Music
        type: folder
        buildPhase: resources
      # 默认浅色壁纸。单文件资源落在 bundle 根目录，
      # WallpaperTheme.image 用 Bundle.main.url(forResource:withExtension:) 读。
      - path: Assets/Wallpaper/daydream.jpg
        buildPhase: resources
      # 内置表情。folder reference 保留目录结构，
      # 代码里用 subdirectory: "Stickers" 取图。
      - path: Assets/Stickers
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.melly.miniphone
        PRODUCT_NAME: MiniPhone
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: Config/Info.plist

schemes:
  MiniPhone:
    build:
      targets:
        MiniPhone: all
    run:
      config: Debug
    archive:
      config: Release
