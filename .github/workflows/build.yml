name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    # 模拟器开机与截图服务都可能无响应，没有上限时 job 会一直挂到 360 分钟默认超时。
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          echo "--- iphoneos SDK ---"
          xcrun --sdk iphoneos --show-sdk-version
          swift --version

      # 规范挡在编译之前：分层 import、重复造轮子、文件规模、密钥泄漏、换行符。
      # 规则见 docs/STANDARDS.md。本地也能跑同一条命令。
      - name: Check standards
        run: |
          python3 scripts/check_standards.py

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: brew install xcodegen

      - name: Generate project
        run: |
          xcodegen --version
          xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project MiniPhone.xcodeproj \
            -scheme MiniPhone \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/MiniPhone.app"
          test -d "$APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry MiniPhone-unsigned.ipa Payload
          ls -lh MiniPhone-unsigned.ipa

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MiniPhone-unsigned-ipa
          path: MiniPhone-unsigned.ipa
          retention-days: 30

      # Runs the real app inside an iOS Simulator and screenshots each screen.
      # This is how the UI gets verified without a physical device: the images
      # come back over git, so no GitHub UI or artifact download is needed.
      - name: Build for simulator
        if: success()
        run: |
          set -o pipefail
          xcodebuild \
            -project MiniPhone.xcodeproj \
            -scheme MiniPhone \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee sim-build.log

      - name: Capture screenshots
        if: success()
        # 截图是验收材料，不是交付物本身。超时或某张失败时继续发布 ipa 与日志，
        # 不让整条构建被模拟器状态拖成 failure。
        timeout-minutes: 34
        continue-on-error: true
        run: |
          set -eux
          # macOS runner 不带 GNU timeout。perl 的 alarm 在 exec 后仍然生效，
          # 用它给每条 simctl 套上限。开机要等几分钟，不能和截图命令共用 25 秒，
          # 否则截图会拍到 Apple logo 和系统主屏（2026-11-05 实际踩过）。
          guarded() {
            local secs="$1"; shift
            perl -e 'alarm shift @ARGV; exec @ARGV' "$secs" "$@"
          }
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=[x for v in d.values() for x in v if x['name'].startswith('iPhone')]; print(c[0]['udid'] if c else '')")
          echo "simulator=$DEVICE_ID"
          # 每次都是全新 runner，模拟器首次启动要 3–8 分钟，300 秒不够
          # （2026-11-05 实际卡在 bootstatus 超时，11 张图一张没出）。
          # 超时也不直接退出：它卡住时模拟器有时其实已经可用，继续 install
          # 至少还有机会出图；真起不来会在 install 那一步失败。
          xcrun simctl shutdown all >/dev/null 2>&1 || true
          guarded 120 xcrun simctl boot "$DEVICE_ID" || true
          guarded 540 xcrun simctl bootstatus "$DEVICE_ID" -b || echo "bootstatus timed out, continuing"
          APP="build-sim/Build/Products/Debug-iphonesimulator/MiniPhone.app"
          test -d "$APP"
          guarded 180 xcrun simctl install "$DEVICE_ID" "$APP" || { echo "install failed"; exit 1; }
          mkdir -p shots

          # 模拟器刚起来时前几次 launch 会失败（SpringBoard 还没接手），
          # 空跑一次把路走通再正式拍，否则 lock/home 这种排在最前的必然丢掉。
          guarded 30 xcrun simctl launch "$DEVICE_ID" com.melly.miniphone -previewState home || true
          sleep 5
          guarded 30 xcrun simctl terminate "$DEVICE_ID" com.melly.miniphone || true
          sleep 2

          for state in lock home homeVector homeDark homeNight chat chatDetail chatStickers chatPhoto charDetail call avatarPicker chatNight chatMine chatEditor moments settings theme calendar notes music health market feed feedProfile feedInbox feedChat feedShare feedCard letters; do
            # -previewState 只在冷启动时读。上一次没退干净就会变成热启动，
            # 参数不生效、界面停在上一个状态，拍出来的图会张冠李戴。
            guarded 25 xcrun simctl terminate "$DEVICE_ID" com.melly.miniphone || true
            sleep 2

            # launch 偶发失败，给三次机会；都失败就跳过，
            # 不要拍一张系统主屏冒充验收图。
            launched=0
            for attempt in 1 2 3; do
              if guarded 25 xcrun simctl launch "$DEVICE_ID" com.melly.miniphone -previewState "$state"; then
                launched=1
                break
              fi
              echo "retry $state ($attempt)"
              sleep 3
            done

            if [ "$launched" = "1" ]; then
              sleep 6
              guarded 45 xcrun simctl io "$DEVICE_ID" screenshot "shots/$state.png" || true
              # 抢占的 runner 上冷启动会超过 4 秒，截到白底的启动图。
              # 启动图没内容、压出来只有几十 KB，按大小判一次，重拍一张。
              size=$(stat -f%z "shots/$state.png" 2>/dev/null || echo 0)
              if [ "$size" -lt 200000 ]; then
                echo "retake $state: ${size} bytes"
                sleep 4
                guarded 45 xcrun simctl io "$DEVICE_ID" screenshot "shots/$state.png" || true
                size=$(stat -f%z "shots/$state.png" 2>/dev/null || echo 0)
                echo "  after retake: ${size} bytes"
                if [ "$size" -lt 200000 ]; then
                  # 重拍还是空白，多半是崩溃而不是慢启动，留一份进程日志再往下走。
                  echo "  $state still blank, dumping app log"
                  guarded 60 xcrun simctl spawn "$DEVICE_ID" log show --last 40s \
                    --predicate 'process == "MiniPhone"' 2>/dev/null | tail -30 || true
                fi
              fi
            else
              echo "skip $state: launch failed"
            fi
            sleep 1
          done
          ls -lh shots

      # Publishes the build log and (on success) the IPA to an orphan branch.
      # This lets a client without GitHub API access retrieve them over plain
      # git/SSH instead of the web UI or artifact endpoints.
      - name: Publish artifacts branch
        if: always()
        env:
          PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd "$RUNNER_TEMP"
          rm -rf pub
          mkdir pub
          cd pub
          git init -q
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git remote add origin "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if [ -f "$GITHUB_WORKSPACE/build.log" ]; then
            cp "$GITHUB_WORKSPACE/build.log" ./build.log
          else
            echo "(no build log produced)" > build.log
          fi

          if [ -f "$GITHUB_WORKSPACE/MiniPhone-unsigned.ipa" ]; then
            cp "$GITHUB_WORKSPACE/MiniPhone-unsigned.ipa" ./MiniPhone-unsigned.ipa
          fi

          if [ -f "$GITHUB_WORKSPACE/sim-build.log" ]; then
            cp "$GITHUB_WORKSPACE/sim-build.log" ./sim-build.log
          fi

          if [ -d "$GITHUB_WORKSPACE/shots" ]; then
            cp -R "$GITHUB_WORKSPACE/shots" ./shots
          fi

          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "sha=${GITHUB_SHA}"
            echo "status=${{ job.status }}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > STATUS.txt

          git add -A
          git commit -q -m "ci ${GITHUB_RUN_ID} ${{ job.status }}"
          git push -f origin HEAD:artifacts
