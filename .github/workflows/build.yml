name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          echo "--- iphoneos SDK ---"
          xcrun --sdk iphoneos --show-sdk-version
          swift --version

      # 规范挡在编译之前：分层 import、重复造轮子、文件规模、密钥泄漏、换行符。
      # 规则见 docs/STANDARDS.md。本地也能跑同一条命令。
      - name: Check standards
        run: |
          python3 scripts/check_standards.py

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: brew install xcodegen

      - name: Generate project
        run: |
          xcodegen --version
          xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project MiniPhone.xcodeproj \
            -scheme MiniPhone \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/MiniPhone.app"
          test -d "$APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry MiniPhone-unsigned.ipa Payload
          ls -lh MiniPhone-unsigned.ipa

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MiniPhone-unsigned-ipa
          path: MiniPhone-unsigned.ipa
          retention-days: 30

      # Runs the real app inside an iOS Simulator and screenshots each screen.
      # This is how the UI gets verified without a physical device: the images
      # come back over git, so no GitHub UI or artifact download is needed.
      - name: Build for simulator
        if: success()
        run: |
          set -o pipefail
          xcodebuild \
            -project MiniPhone.xcodeproj \
            -scheme MiniPhone \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee sim-build.log

      - name: Capture screenshots
        if: success()
        run: |
          set -eux
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=[x for v in d.values() for x in v if x['name'].startswith('iPhone')]; print(c[0]['udid'] if c else '')")
          echo "simulator=$DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          APP="build-sim/Build/Products/Debug-iphonesimulator/MiniPhone.app"
          test -d "$APP"
          xcrun simctl install "$DEVICE_ID" "$APP"
          mkdir -p shots
          for state in lock home chat moments settings; do
            xcrun simctl launch "$DEVICE_ID" com.melly.miniphone -previewState "$state" || true
            sleep 4
            xcrun simctl io "$DEVICE_ID" screenshot "shots/$state.png" || true
            xcrun simctl terminate "$DEVICE_ID" com.melly.miniphone || true
            sleep 1
          done
          ls -lh shots

      # Publishes the build log and (on success) the IPA to an orphan branch.
      # This lets a client without GitHub API access retrieve them over plain
      # git/SSH instead of the web UI or artifact endpoints.
      - name: Publish artifacts branch
        if: always()
        env:
          PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd "$RUNNER_TEMP"
          rm -rf pub
          mkdir pub
          cd pub
          git init -q
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git remote add origin "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if [ -f "$GITHUB_WORKSPACE/build.log" ]; then
            cp "$GITHUB_WORKSPACE/build.log" ./build.log
          else
            echo "(no build log produced)" > build.log
          fi

          if [ -f "$GITHUB_WORKSPACE/MiniPhone-unsigned.ipa" ]; then
            cp "$GITHUB_WORKSPACE/MiniPhone-unsigned.ipa" ./MiniPhone-unsigned.ipa
          fi

          if [ -f "$GITHUB_WORKSPACE/sim-build.log" ]; then
            cp "$GITHUB_WORKSPACE/sim-build.log" ./sim-build.log
          fi

          if [ -d "$GITHUB_WORKSPACE/shots" ]; then
            cp -R "$GITHUB_WORKSPACE/shots" ./shots
          fi

          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "sha=${GITHUB_SHA}"
            echo "status=${{ job.status }}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > STATUS.txt

          git add -A
          git commit -q -m "ci ${GITHUB_RUN_ID} ${{ job.status }}"
          git push -f origin HEAD:artifacts
