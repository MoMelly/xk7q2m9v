name: Probe runner

# 诊断用：确认账户的 Actions 本身可用、只是 macOS 机器排队，
# 还是整个账户被限流。跑两次对比即可，结论出来后可删除本文件。

on:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Runtime
        run: |
          uname -a
          python3 --version

  macos:
    runs-on: macos-26
    steps:
      - name: Runtime
        run: |
          xcodebuild -version
          swift --version
